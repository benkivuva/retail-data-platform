name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Write BigQuery service account key
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa.json

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          retail_data_platform:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: staging
                keyfile: /tmp/gcp-sa.json
                threads: 4
                location: US
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
            target: dev
          EOF

      - name: dbt debug
        working-directory: dbt
        run: uv run dbt debug

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build