name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPO_NAME: dev-retail-platform

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run platform tests
        run: uv run pytest platform/tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Flask Image
        run: |
          docker build -f Dockerfile.flask \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/flask-app:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/flask-app:main-latest \
            .

      - name: Build Dagster Image
        run: |
          docker build -f Dockerfile.dagster \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dagster:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dagster:main-latest \
            .

      # --- SHIFT-LEFT SECURITY SCANNING ---

      - name: Scan Flask Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/flask-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fail the pipeline if vulnerabilities are found
          ignore-unfixed: true # Ignore vulnerabilities that have no available patch
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Dagster Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dagster:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # -----------------------------------------------

      - name: Push Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/flask-app:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/flask-app:main-latest
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dagster:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dagster:main-latest

      - name: Update GitOps Manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # 1. Configure git with the PAT
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 2. Clone Repo 3 using the PAT
          git clone https://x-access-token:${GITOPS_PAT}@github.com/benkivuva/retail-platform-gitops.git
          cd retail-platform-gitops
          
          # 3. Replace the image tag with the specific Git SHA
          sed -i "s|flask-app:.*|flask-app:${{ github.sha }}|g" apps/flask/deployment.yaml
          sed -i "s|dagster:.*|dagster:${{ github.sha }}|g" apps/dagster/deployment-webserver.yaml
          sed -i "s|dagster:.*|dagster:${{ github.sha }}|g" apps/dagster/deployment-daemon.yaml
          
          # 4. Commit and push
          git add apps/
          git commit -m "chore(gitops): update image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main