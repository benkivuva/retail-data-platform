[project]
name = "retail-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "benkivuva", email = "benkivuvak5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "dagster>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dagster-soda>=0.29.25",
    "dagster-webserver>=1.13.25",
    "dash>=4.4.1",
    "db-dtypes>=1.7.2",
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "faker>=40.41.0",
    "flask>=3.1.3",
    "flask-caching>=2.5.1",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-bigquery-storage>=2.42.0",
    "google-genai>=1.75.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-instrumentation>=0.66b1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "soda-core-bigquery>=3.5.6",
]

[project.scripts]
retail-data-platform = "retail_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
