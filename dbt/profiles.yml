retail_data_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'retail-data-platform-511008') }}"
      dataset: "{{ env_var('DBT_DATASET', 'staging') }}"
      threads: 4
      location: US
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1