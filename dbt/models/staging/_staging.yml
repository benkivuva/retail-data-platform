version: 2

models:
  - name: stg_suppliers
    description: "Cleaned supplier master data."
    columns:
      - name: supplier_id
        tests: [unique, not_null]

  - name: stg_products
    description: "Cleaned product catalogue."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id

  - name: stg_customers
    description: "Cleaned customer master data."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_orders
    description: "One row per customer order, with financials."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_order_items
    description: "One row per line item in an order."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_payments
    description: "One row per payment record."
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_deliveries
    description: "One row per delivery attempt."
    columns:
      - name: delivery_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_inventory_snapshots
    description: "Daily inventory position per product per warehouse."
    columns:
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_supplier_orders
    description: "Purchase orders placed with suppliers."
    columns:
      - name: supplier_order_id
        tests: [unique, not_null]
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id