version: 2

models:
  - name: ai_daily_metrics
    description: "Read-only, PII-free daily metrics for AI assistants. Mirrors metrics_daily exactly."
    columns:
      - name: metric_date
        tests: [unique, not_null]

  - name: ai_customers_summary
    description: "Aggregated customer counts by segment and acquisition channel. No PII."
    columns:
      - name: segment
        tests: [not_null]

  - name: ai_products_summary
    description: "Product catalogue aggregated by category. No PII."
    columns:
      - name: category
        tests: [not_null]