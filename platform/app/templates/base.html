<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retail Data Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">Retail Data Platform</div>
        <nav>
            <a href="/dashboards/operations/">Operations</a>
            {% if current_user.is_authenticated %}
                <span class="user">{{ current_user.display_name }} · {{ current_user.role }}</span>
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% endif %}
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
